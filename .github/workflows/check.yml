name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cornelius-modules
      # Même disposition qu'en local : Cornelius (public) à côté de ce dépôt.
      - uses: actions/checkout@v4
        with:
          repository: lfpoulain/Cornelius
          ref: main
          path: cornelius
      - uses: actions/setup-node@v4
        with:
          node-version-file: cornelius/.nvmrc
          cache: npm
          cache-dependency-path: cornelius/package-lock.json
      - run: npm ci
        working-directory: cornelius
      - run: npm run format:check
        working-directory: cornelius-modules
      - run: npm run check
        working-directory: cornelius-modules
      - run: npm test
        working-directory: cornelius-modules
